<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login | Shree C. P. Gajjar Highschool, Jhulasan</title>
  <link rel="stylesheet" href="portal.css">
  <style>
    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrapper .form-control {
      padding-right: 42px;
    }
    .toggle-eye {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.15rem;
      color: #64748b;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .toggle-eye:hover {
      color: #0d9488;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <img src="../Images/School Logo.png" alt="School Logo">
        <h2>Shree C. P. Gajjar Highschool</h2>
        <p>Digital School Management Portal</p>
      </div>

      <div class="role-tabs">
        <button type="button" class="role-tab active" onclick="selectRole('principal', this)">🏛️ Principal</button>
        <button type="button" class="role-tab" onclick="selectRole('teacher', this)">👨‍🏫 Teacher</button>
        <button type="button" class="role-tab" onclick="selectRole('student', this)">🎓 Student</button>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label id="idLabel">Principal ID</label>
          <input type="text" id="userId" class="form-control" placeholder="Enter ID" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="userPass" class="form-control" placeholder="Enter Password" required>
            <button type="button" class="toggle-eye" id="eyeBtn" onclick="togglePassword()" title="Show/Hide Password">👁️</button>
          </div>
        </div>
        <p id="loginError" style="color: #ef4444; font-size: 0.85rem; margin-bottom: 12px; display: none;"></p>
        <button type="submit" class="btn-block">Login to Portal</button>
      </form>

      <div class="demo-hint" id="demoHint">
        <strong>Principal Demo Login:</strong><br>
        ID: <code>admin</code> | Password: <code>principal123</code>
      </div>

      <div style="text-align: center; margin-top: 15px;">
        <a href="../index.html" style="color: #0d9488; text-decoration: none; font-weight: 600; font-size: 0.9rem;">⬅ Back to Main Website</a>
      </div>
    </div>
  </div>

  <script src="portal-data.js"></script>
  <script>
    let currentRole = "principal";

    function togglePassword() {
      const passInput = document.getElementById("userPass");
      const eyeBtn = document.getElementById("eyeBtn");
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeBtn.innerText = "🙈";
      } else {
        passInput.type = "password";
        eyeBtn.innerText = "👁️";
      }
    }

    function selectRole(role, btn) {
      currentRole = role;
      document.querySelectorAll(".role-tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");

      const idLabel = document.getElementById("idLabel");
      const demoHint = document.getElementById("demoHint");
      document.getElementById("loginError").style.display = "none";

      if (role === "principal") {
        idLabel.innerText = "Principal ID";
        demoHint.innerHTML = "<strong>Principal Demo Login:</strong><br>ID: <code>admin</code> | Password: <code>principal123</code>";
      } else if (role === "teacher") {
        idLabel.innerText = "Teacher Username";
        demoHint.innerHTML = "<strong>Teacher Demo Login:</strong><br>ID: <code>aditya</code> | Password: <code>teacher123</code>";
      } else {
        idLabel.innerText = "Student Roll Number / GR No.";
        demoHint.innerHTML = "<strong>Student Demo Login:</strong><br>ID: <code>101</code> | Password: <code>student123</code>";
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById("userId").value.trim().toLowerCase();
      const pass = document.getElementById("userPass").value.trim();
      const db = getSchoolData();

      const matchedUser = db.users.find(u => u.id.toLowerCase() === id && u.pass === pass && u.role === currentRole);

      if (!matchedUser) {
        const err = document.getElementById("loginError");
        err.innerText = "Invalid credentials for the selected role. Please check ID and Password.";
        err.style.display = "block";
        return;
      }

      sessionStorage.setItem("cpg_active_user", JSON.stringify(matchedUser));

      if (currentRole === "principal") window.location.href = "principal.html";
      if (currentRole === "teacher") window.location.href = "teacher.html";
      if (currentRole === "student") window.location.href = "student.html";
    }
  </script>
</body>
</html>
